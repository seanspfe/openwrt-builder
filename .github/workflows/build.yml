name: Build firmware

# Manual runs pick a target in the "Run workflow" dialog. A push to main that
# touches .build-trigger builds every target; that path exists so a build can
# be kicked off by committing, and it is the only push trigger on purpose:
# ordinary file changes never start a multi-hour build by themselves.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to build
        required: true
        default: all
        type: choice
        options:
          - all
          - x86_64
          - gl-mt3000
          - hc5962
  push:
    branches: [main]
    paths: ['.build-trigger']

run-name: >-
  Build ${{ inputs.target || 'all' }} - OpenWrt v25.12.6 + daed 2026.11.09

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: false

env:
  # Pins. scripts/prepare-tree.sh verifies every checkout against the commit
  # here, so a moved tag fails the build instead of drifting silently.
  OWRT_REPO: https://github.com/openwrt/openwrt.git
  OWRT_TAG: v25.12.6
  OWRT_COMMIT: 64900e756efa667774214f9c6b17c113222e01f7
  OWRT_KERNEL: 6.12.112
  DAEDE_REPO: https://github.com/kenzok8/openwrt-daede.git
  DAEDE_COMMIT: bc6fb7ca997b1de42ae3b8d67574ce5717816995
  DAED_VERSION: '2026.11.09'
  VANTAGE_REPO: https://github.com/anothaDev/luci-theme-vantage.git
  VANTAGE_TAG: v1.0.14
  VANTAGE_COMMIT: cddbfb262b7a67a0d3762039e4af66fc0ac92000
  # The build tree lives inside the checkout so artifacts and logs stay together.
  SRC_ROOT: ${{ github.workspace }}/.src

defaults:
  run:
    shell: bash

jobs:
  # Turns the choice input into a matrix. A job-level `if` cannot read the
  # matrix, so the selection is done here.
  select:
    name: Select targets
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          TARGET_INPUT: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          case "$TARGET_INPUT" in
            all)
              echo 'matrix={"include":[{"target":"x86_64"},{"target":"gl-mt3000"},{"target":"hc5962"}]}' >> "$GITHUB_OUTPUT"
              ;;
            x86_64|gl-mt3000|hc5962)
              echo "matrix={\"include\":[{\"target\":\"${TARGET_INPUT}\"}]}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unknown target '${TARGET_INPUT}'" >&2
              exit 1
              ;;
          esac

  build:
    name: ${{ matrix.target }}
    needs: select
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner image carries ~14 GB of SDKs this build never touches; a
      # full OpenWrt tree with debug info and a Rust workspace needs the room.
      - name: Free disk space
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/az \
            /opt/microsoft \
            /usr/local/.ghcup \
            /home/linuxbrew
          sudo apt-get purge -y 'dotnet-*' 'ghc-*' 'google-chrome-*' 'google-cloud-sdk-*' 2>/dev/null || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          df -h /

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libclang-dev libelf-dev libncurses5-dev libncursesw5-dev \
            libssl-dev llvm pkg-config python3 python3-dev python3-distutils \
            python3-setuptools rsync time unzip wget zlib1g-dev zstd
          clang --version

      - name: Prepare OpenWrt tree
        run: bash scripts/prepare-tree.sh

      - name: Merge config
        working-directory: .src/openwrt
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/configs/${{ matrix.target }}.config" .config
          make defconfig
          ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/config-${{ matrix.target }}.diffconfig"
          wc -l "$GITHUB_WORKSPACE/config-${{ matrix.target }}.diffconfig"

      - name: Verify merged config
        run: |
          bash scripts/verify-config.sh "${{ matrix.target }}" "$SRC_ROOT/openwrt"

      - name: Download package sources
        working-directory: .src/openwrt
        run: |
          set -euo pipefail
          make download -j"$(nproc)" ||
            echo "::warning::some sources failed to download; the build step will retry them"

      - name: Build firmware
        working-directory: .src/openwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build-${{ matrix.target }}.log"

      - name: Verify image contents
        run: bash scripts/verify-manifest.sh "${{ matrix.target }}" "$SRC_ROOT/openwrt"

      - name: Collect images
        run: |
          set -euo pipefail
          mkdir -p "out/${{ matrix.target }}"
          find .src/openwrt/bin/targets -maxdepth 2 -type f \
            \( -name '*.img.gz' -o -name '*.bin' -o -name '*.manifest' \
               -o -name '*.buildinfo' -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -exec cp {} "out/${{ matrix.target }}/" \;
          ls -lh "out/${{ matrix.target }}"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.6-${{ matrix.target }}
          path: out/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload config and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.6-${{ matrix.target }}-config-log
          path: |
            config-${{ matrix.target }}.diffconfig
            build-${{ matrix.target }}.log
          if-no-files-found: warn
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## ${{ matrix.target }}"
            echo
            echo "- OpenWrt v25.12.6 (\`$OWRT_COMMIT\`), kernel $OWRT_KERNEL"
            echo "- daed $DAED_VERSION (kenzok8/openwrt-daede \`$DAEDE_COMMIT\`), LuCI app luci-app-daede"
            echo "- Vantage $VANTAGE_TAG (\`$VANTAGE_COMMIT\`)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -d "out/${{ matrix.target }}" ]; then
            {
              echo '```'
              ls -lh "out/${{ matrix.target }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
